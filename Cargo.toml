[package]
name = "reaven"
version = "0.2.0"
edition = "2021"
description = "Server-relayed remote administration: shell, files, screen streaming, webcam and input control"
license = "MIT"

[[bin]]
name = "reaven"
path = "src/main.rs"

[features]
# Everything on by default. Turn features off for a smaller/headless build,
# e.g. `cargo build --no-default-features --features screen,input`.
default = ["screen", "input", "webcam"]
screen = ["dep:x11rb", "dep:image", "dep:jpeg-encoder"]
webcam = ["dep:nokhwa", "dep:image", "dep:jpeg-encoder"]
input = ["dep:enigo"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "=0.28.1"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "=1.11.0", features = ["v4"] }

# --- WSS transport (TLS + WebSocket) ---
futures-util = { version = "0.3", features = ["sink"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

# Automatic Let's Encrypt certificates (TLS-ALPN-01) and local self-signed certs.
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "tokio", "webpki-roots"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
log = "0.4"
env_logger = "0.11"

# --- desktop capture / injection (feature-gated) ---
# Pure-Rust X11 client: links no C libraries, so a missing libxcb or
# libdbus can never stop the binary from starting.
x11rb = { version = "0.13", optional = true, default-features = false, features = ["randr"] }
enigo = { version = "0.6", optional = true }
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-native"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = { version = "0.6", optional = true }

[profile.release]
lto = "thin"
strip = true
