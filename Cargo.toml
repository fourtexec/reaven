[package]
name = "reaven"
version = "0.2.0"
edition = "2021"
description = "Server-relayed remote administration: shell, files, screen streaming, webcam and input control"
license = "MIT"

[[bin]]
name = "reaven"
path = "src/main.rs"

[features]
# Everything on by default. Turn features off for a smaller/headless build,
# e.g. `cargo build --no-default-features --features screen,input`.
default = ["screen", "input", "webcam"]
screen = ["dep:xcap", "dep:image", "dep:jpeg-encoder"]
webcam = ["dep:nokhwa", "dep:image", "dep:jpeg-encoder"]
input = ["dep:enigo"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "=0.28.1"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "=1.11.0", features = ["v4"] }

# --- desktop capture / injection (feature-gated) ---
xcap = { version = "0.4", optional = true }
enigo = { version = "0.6", optional = true }
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-native"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = { version = "0.6", optional = true }

[profile.release]
lto = "thin"
strip = true
