name: Release

on:
  push:
    tags:
      - 'v*' # Срабатывает только при пуше тегов, например v1.0.0, v0.2.1-alpha

permissions:
  contents: write # Важно: дает права на создание релизов

jobs:
  release:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: reaven-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: reaven.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Rename artifact
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv target/${{ matrix.target }}/release/my_app.exe ./${{ matrix.artifact_name }}
        else
          mv target/${{ matrix.target }}/release/my_app ./${{ matrix.artifact_name }}
        fi

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

