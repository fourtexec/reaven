name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: reaven-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: reaven-windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Сохраняем кэш только для основной ветки, чтобы ветки с PR
          # не засоряли общий кэш и не сбрасывали его [citation:2][citation:5]
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Install musl tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # sccache кэширует результаты компиляции отдельных крейтов,
          # что ускоряет пересборку только изменённых частей [citation:3][citation:15]
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          # Отключаем инкрементальную компиляцию, чтобы избежать конфликтов
          # с кэшем sccache в CI-окружении
          CARGO_INCREMENTAL: "0"

      - name: Rename artifact
        shell: bash
        run: |
          set -e
          BIN_NAME="reaven"   # ← имя бинарника из Cargo.toml
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SRC="${SRC}.exe"
          fi
          ls -la "$(dirname "$SRC")" || true
          mv "$SRC" "./${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
